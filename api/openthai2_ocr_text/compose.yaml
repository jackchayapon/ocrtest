services:
  openthai:
    build: .
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      OPENTHAI_MODEL_DIR: /models/openthai2
      OPENTHAI_API_KEY: ${OPENTHAI_API_KEY:-}
    volumes:
      - ./models/openthai2:/models/openthai2:ro
    mem_limit: 1536m
    cpus: 1
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
